services:
  postgres:
    image: postgres:16-alpine
    container_name: yarnly-postgres
    environment:
      POSTGRES_USER: yarnly
      POSTGRES_PASSWORD: yarnly
      POSTGRES_DB: yarnly
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init-test-db.sql:/docker-entrypoint-initdb.d/02-test-db.sql
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yarnly -d yarnly']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: yarnly-backend
    depends_on:
      postgres:
        condition: service_healthy
    # Values here take precedence over backend/.env (dotenv never overrides).
    environment:
      NODE_ENV: development
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      DB_URI: postgresql://yarnly:yarnly@postgres:5432/yarnly
      JWT_SECRET: change-me
      SEED_DEMO: 'true'
    ports:
      - '5000:5000'
    # Source is bind-mounted; Windows bind mounts don't deliver file events, so
    # nodemon polls (--legacy-watch). node_modules stays in the image.
    volumes:
      - ./backend/src:/app/src
      - ./backend/scripts:/app/scripts
      - ./backend/db:/app/db
      - type: bind
        source: ./backend/.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
    command:
      ['npx', 'nodemon', '--legacy-watch', '--watch', 'src', '--watch', 'db', '--watch', '.env', 'src/server.js']
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: yarnly-frontend
    depends_on:
      - backend
    environment:
      VITE_API_PROXY_TARGET: http://backend:5000
      VITE_USE_POLLING: 'true'
    ports:
      - '5173:5173'
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    restart: unless-stopped

volumes:
  postgres_data:
